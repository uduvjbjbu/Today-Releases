async function loadCatalog(){

 try{

  if(json.schema!=='today-catalog-v1'||json.builtInCount!==179||!Array.isArray(json.items)||json.items.length!==179||new Set(json.items.map(e=>e.id)).size!==179)throw new Error('카탈로그 데이터 검증 실패');
  builtInCatalog=normalizeCatalog(json.items);
  const customs=libraryCustomItems();
  state.library=[...builtInCatalog,...customs];
  state.catalogVersion='today-catalog-v1';
  catalogReady=true;
  save();
 }catch(error){

 }

}

function calendarView(){const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),pad=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();const dayNames=['월','화','수','목','금','토','일'];let cells=Array.from({length:pad},()=>'<div class="day blank"></div>');for(let n=1;n<=last;n++){const d=new Date(y,m,n),rest=isRest(d),s=sesFor(d),num=workoutFor(d),label=rest?'휴식':s?.finished?'완료 W'+s.num:'W'+num;cells.push(`<button class="day ${rest?'off':''} ${s?.finished?'completed':''} ${iso(d)===iso(todayDate())?'current':''}" data-action="open-date" data-date="${iso(d)}" aria-label="${n}일 ${label}"><span class="n">${n}</span><span class="tag">${label}</span></button>`)}return `<section class="card cal"><div class="calendar-toolbar"><button class="tiny" data-action="month-prev">‹ 이전달</button><span class="month">${y}년 ${m+1}월</span><button class="tiny" data-action="month-next">다음달 ›</button></div><div class="weekdays">${dayNames.map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells.join('')}</div><div class="calendar-legend"><span><i class="dot"></i> 운동 계획</span><span><i class="dot gray"></i> 휴식 / 휴관</span><span><i class="dot green"></i> 완료된 운동</span></div></section><div class="note">달력의 날짜를 눌러 <b>휴식 지정·해제 / Workout 1~7 선택 / 기본 일정 복귀</b>를 체험할 수 있어요. 미래 일정은 예상 순서입니다.</div>`}
function routinesView(){const r=routine(state.selectedRoutine);return `<div class="routine-grid">${state.routines.map(t=>`<button class="routine ${r.n===t.n?'selected':''}" data-action="choose-routine" data-num="${t.n}"><strong>Workout ${t.n}</strong><b>${esc(t.title)}</b><small>${esc(t.goal)}</small><small>${t.ex.length}종목 · ${totalEx(t)}세트</small></button>`).join('')}</div><section class="card routine-detail"><div class="heading-row"><div><div class="eyebrow">ROUTINE BUILDER</div><h2 style="margin:3px 0">Workout ${r.n} · ${esc(r.title)}</h2><p class="muted" style="margin:0">${esc(r.goal)}</p></div><button class="btn sec" data-action="add-to-routine">+ 라이브러리에서 추가</button></div><div style="margin-top:17px">${r.ex.map((e,i)=>`<div class="routine-item"><div><span class="ex-phase">${esc(e.phase)} · ${esc(e.muscle)}</span><b>${esc(e.name)}</b><small>${e.target}세트 × ${esc(e.reps)}회</small></div><div class="toolbar"><button class="tiny" data-action="move-ex" data-id="${esc(e.id)}" data-to="${i-1}" title="위로" ${i===0?'disabled':''}>↑</button><button class="tiny" data-action="move-ex" data-id="${esc(e.id)}" data-to="${i+1}" title="아래로" ${i===r.ex.length-1?'disabled':''}>↓</button><button class="tiny" data-action="edit-ex" data-id="${esc(e.id)}">편집</button><button class="tiny" data-action="del-ex" data-id="${esc(e.id)}">삭제</button></div></div>`).join('')}</div></section><p class="hint">변경한 데모 루틴은 이 브라우저에만 저장됩니다. 설치형 Today나 다른 사람에게는 반영되지 않습니다.</p>`}
function statsView(){const end=shift(statWeek,6),sessions=Object.entries(state.sessions).filter(([d,s])=>d>=iso(statWeek)&&d<=iso(end)).map(([d,s])=>({date:d,s})),totals=Object.fromEntries([...M,'기타'].map(m=>[m,0]));let all=0;for(const {s} of sessions){const r=routine(s.num);for(const e of r.ex){const c=s.counts[e.id]||0;totals[e.muscle]=(totals[e.muscle]||0)+c;all+=c;}}const max=Math.max(1,...Object.values(totals));const format=d=>`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;return `<div class="heading-row"><div><div class="eyebrow">WEEKLY RESULTS</div><h2 style="margin:6px 0 0">${format(statWeek)} — ${format(end)} 주간 기록</h2></div><div class="toolbar"><button class="tiny" data-action="week-prev">← 이전 주</button><button class="tiny" data-action="week-next">다음 주 →</button></div></div><div class="stats-top" style="margin-top:18px"><div class="stat"><b>${sessions.filter(x=>x.s.finished).length}</b><small>완료한 Workout</small></div><div class="stat"><b>${all}</b><small>수행 세트</small></div><div class="stat"><b>${sessions.length}</b><small>기록 있는 날</small></div></div><section class="card stats-card"><div class="sectionline" style="margin:0 0 25px"><h2>부위별 실제 세트 수</h2><span>종목의 근육 분류 기준</span></div><div class="barlist">${M.map(m=>`<div class="baritem"><span>${m}</span><div class="track"><div class="bar" style="width:${Math.round((totals[m]||0)/max*100)}%"></div></div><b>${totals[m]||0}세트</b></div>`).join('')}</div></section><section class="card stats-card"><div class="sectionline" style="margin:0 0 8px"><h2>이번 주 수행 목록</h2></div>${sessions.length?sessions.map(({date,s})=>`<div class="routine-item"><div><b>${esc(date)} · Workout ${s.num}</b><small>${esc(routine(s.num).title)}</small></div><span class="pill">${s.finished?'완료':'진행 중'} · ${Object.values(s.counts).reduce((a,n)=>a+n,0)}세트</span></div>`).join(''):'<div class="empty">이 주에는 기록이 없어요. Today에서 +를 눌러보세요.</div>'}</section>`}
function libraryView(){
 const filtered=filterLibrary(libSearch,libFilter,eqFilter);
 return `<div class="heading-row"><div><div class="eyebrow">EXERCISE LIBRARY · ANDROID SOURCE</div><h2 style="margin:4px 0">운동 종목 라이브러리</h2><div class="muted">실제 Today 앱에 내장된 운동 종목을 검색하고 Workout에 추가해 보세요.</div></div><button class="btn" data-action="new-lib">+ 새 종목</button></div>
 ${catalogStatus()}
 <div class="library-tools"><input class="search" id="lib-search" value="${esc(libSearch)}" placeholder="운동 이름 검색" aria-label="운동 종목 검색"><select class="filter" id="lib-filter" aria-label="운동 부위"><option value="전체" ${libFilter==='전체'?'selected':''}>전체 부위</option>${MUSCLES.map(m=>`<option value="${m}" ${libFilter===m?'selected':''}>${m}</option>`).join('')}</select><select class="filter" id="eq-filter" aria-label="운동 기구"><option value="전체" ${eqFilter==='전체'?'selected':''}>전체 기구</option>${EQ.map(v=>`<option value="${v}" ${eqFilter===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="result-count">검색 결과 <b>${filtered.length}종목</b> <span>전체 ${catalogReady?state.library.length:'—'}종목</span></div>
 <div class="liblist">${catalogReady?(filtered.map(e=>libraryItemView(e)).join('')||'<div class="empty">검색 결과가 없어요. 다른 부위·기구를 선택하거나 직접 종목을 등록해 보세요.</div>'):'<div class="empty">운동 목록을 불러오는 중이에요. 인터넷 연결을 확인해 주세요.</div>'}</div>
 <p class="hint">실제 Today 앱에 기본 제공되는 179종목을 소스 기준으로 반영했습니다. 기구·부위별 분류와 종목 선택은 실제로 동작합니다. 웹 시연 데이터는 설치형 앱과 동기화되지 않습니다.</p>`;
}
function closeModal(){$('#modal-root').classList.remove('open');$('#modal').innerHTML=''}
function showModal(body){$('#modal').innerHTML=body;$('#modal-root').classList.add('open');$('#modal').querySelector('button')?.focus()}
function modalWrap(title,content){return `<div class="modal-top"><h2>${esc(title)}</h2><button class="modal-close" data-action="close">×</button></div>${content}`}
function dateModal(str){const d=from(str),rest=isRest(d),num=workoutFor(d),s=state.sessions[str];showModal(modalWrap(`${d.getMonth()+1}월 ${d.getDate()}일 일정`, `<p>현재 상태: <strong style="color:var(--lime)">${rest?'휴식 / 휴관':'Workout '+num}</strong>${s?.finished?' · 완료 기록 있음':''}</p><div class="eyebrow">원하는 Workout 직접 지정</div><div class="choose">${state.routines.map(r=>`<button data-action="assign" data-date="${str}" data-num="${r.n}" class="${!rest&&num===r.n?'active':''}">W${r.n} · ${esc(r.title)}</button>`).join('')}</div><div class="modal-actions"><button class="btn sec" data-action="rest" data-date="${str}">휴식 지정</button><button class="btn dark" data-action="default" data-date="${str}">기본 일정 복귀</button></div><p class="hint">완료 기록이 있는 날짜를 바꾸면 해당 날짜의 시연 기록은 초기화됩니다.</p>`))}
function recordsModal(id){const d=todayDate(),s=mkSession(d),r=routine(s.num),e=r.ex.find(x=>x.id===id);if(!e)return;const count=s.counts[id]||0;if(!s.records)s.records={};const rec=s.records[id]||[];showModal(modalWrap(e.name,`<p>목표 ${e.target}세트 · ${esc(e.reps)}회 · 실제 수행 ${count}세트</p>${count?`<div class="record-grid"><span>세트</span><span>중량 kg</span><span>반복 횟수</span>${Array.from({length:count},(_,i)=>`<span>${i+1}세트</span><input type="number" min="0" max="999" step="0.5" data-record="weight" data-set="${i}" data-id="${esc(id)}" placeholder="kg" value="${esc(rec[i]?.weight||'')}"><input type="number" min="0" max="999" step="1" data-record="reps" data-set="${i}" data-id="${esc(id)}" placeholder="회" value="${esc(rec[i]?.reps||'')}">`).join('')}</div>`:'<div class="empty">먼저 + 버튼으로 세트를 추가하세요.</div>'}<div class="modal-actions"><button class="btn" data-action="close">기록 저장하고 닫기</button></div>`))}
function editModal(id){const r=routine(state.selectedRoutine),e=r.ex.find(x=>x.id===id);if(!e)return;showModal(modalWrap('운동 종목 편집',`<div class="field"><label>종목명</label><input id="edit-name" maxlength="48" value="${esc(e.name)}"></div><div class="field"><label>목표 세트</label><input id="edit-target" type="number" min="1" max="30" value="${e.target}"></div><div class="field"><label>반복수 범위</label><input id="edit-reps" maxlength="25" value="${esc(e.reps)}"></div><div class="field"><label>운동 부위</label><select id="edit-muscle">${M.map(m=>`<option ${m===e.muscle?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>단계</label><select id="edit-phase">${['선피로','고강도','후면사슬','둔근','마무리','이두','삼두'].map(m=>`<option ${m===e.phase?'selected':''}>${m}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn" data-action="save-ex" data-id="${esc(id)}">변경 저장</button></div>`))}
function chooseLibModal(){
 if(!catalogReady){loadCatalog();showModal(modalWrap('운동 라이브러리',`<p>운동 라이브러리를 불러오는 중입니다. 잠시 뒤 다시 시도해 주세요.</p><button class="btn" data-action="reload-catalog">다시 불러오기</button>`));return;}
 showModal(modalWrap(`Workout ${state.selectedRoutine}에 종목 추가`, `<p>실제 Today 앱 기본 179종목 · 부위와 기구로 검색할 수 있어요.</p><div class="library-tools picker-tools"><input id="picker-search" class="search" placeholder="종목 검색" aria-label="추가할 운동 검색"><select class="filter" id="picker-muscle"><option value="전체">전체 부위</option>${MUSCLES.map(m=>`<option>${m}</option>`).join('')}</select><select class="filter" id="picker-equipment"><option value="전체">전체 기구</option>${EQ.map(v=>`<option>${v}</option>`).join('')}</select></div><div class="result-count" id="picker-count"></div><div id="picker-results" style="max-height:310px;overflow-y:auto"></div><div class="modal-actions"><button class="btn sec" data-action="new-lib">+ 직접 종목 추가</button></div>`));
 refreshPicker();
 $('#picker-search')?.focus();
}
function refreshPicker(){
 if(!$('#picker-results'))return;
 const matches=filterLibrary($('#picker-search')?.value||'',$('#picker-muscle')?.value||'전체',$('#picker-equipment')?.value||'전체');
 $('#picker-count').textContent=`검색 결과 ${matches.length}종목`;
 $('#picker-results').innerHTML=matches.map(e=>libraryItemView(e,true)).join('')||'<div class="empty">검색 결과가 없어요.</div>';
}
function addLib(id,n=state.selectedRoutine){const item=state.library.find(x=>x.id===id);if(!item)return;const r=routine(n);if(r.ex.length>=40){toast('한 Workout에 최대 40종목까지 추가할 수 있어요');return;}r.ex.push({id:`custom-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,name:item.name,target:item.sets||3,reps:item.reps||'8–12',phase:'마무리',muscle:item.muscle});save();closeModal();render();toast(`Workout ${n}에 추가했어요`)}
function reset(){if(!confirm('브라우저의 시연 기록과 편집 내용을 모두 초기화할까요? 실제 Today 앱에는 영향이 없습니다.'))return;state=fresh();seedDemo();save();closeModal();render();toast('데모가 초기화됐어요')}
function doAction(btn){const act=btn.dataset.action,dt=btn.dataset.date,id=btn.dataset.id,num=Number(btn.dataset.num);if(act==='page'){page=btn.dataset.page;window.scrollTo(0,0);render();return}if(act==='reset')return reset();if(act==='reload-catalog')return loadCatalog();if(act==='close')return closeModal();if(act==='open-date')return dateModal(dt);if(act==='month-prev'||act==='month-next'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(act==='month-prev'?-1:1),1);render();return}if(act==='week-prev'||act==='week-next'){statWeek=shift(statWeek,act==='week-prev'?-7:7);render();return}if(act==='choose-routine'){state.selectedRoutine=num;save();render();return}if(['plus','minus','check'].includes(act)){const d=todayDate();if(isRest(d)){toast('휴식일을 운동일로 변경해 주세요');return}const s=mkSession(d),r=routine(s.num),e=r.ex.find(x=>x.id===id);if(!e)return;if(s.finished)s.finished=false;if(act==='check')s.done[id]=!s.done[id];else{let c=s.counts[id]||0;c=Math.max(0,Math.min(50,c+(act==='plus'?1:-1)));s.counts[id]=c;if(!s.records)s.records={};let a=s.records[id]||[];if(c>a.length)a.push({weight:'',reps:''});s.records[id]=a.slice(0,c)}save();render();return}if(act==='records')return recordsModal(id);if(act==='finish'){const s=mkSession(todayDate());s.finished=!s.finished;save();render();toast(s.finished?'Workout 완료! 다음 운동일로 순환합니다.':'완료를 취소했어요');return}if(act==='rest'||act==='assign'||act==='default'){if(state.sessions[dt]&&!confirm('이 날짜의 시연 세트 기록이 초기화됩니다. 계속할까요?'))return;delete state.sessions[dt];if(act==='rest')state.overrides[dt]={kind:'rest'};else if(act==='assign')state.overrides[dt]={kind:'workout',num};else delete state.overrides[dt];save();closeModal();render();toast('날짜 일정이 변경됐어요');return}if(act==='add-to-routine')return chooseLibModal();if(act==='library-add'){const e=state.library.find(x=>x.id===id);if(!e)return;showModal(modalWrap('Workout 선택',`<p><strong>${esc(e.name)}</strong> 종목을 어느 Workout에 추가할까요?</p><div class="choose">${state.routines.map(r=>`<button data-action="lib-add-at" data-id="${esc(id)}" data-num="${r.n}">W${r.n} · ${esc(r.title)}</button>`).join('')}</div>`));return}if(act==='lib-add-at'||act==='pick-lib')return addLib(id,act==='pick-lib'?state.selectedRoutine:num);if(act==='move-ex'){const r=routine(state.selectedRoutine),i=r.ex.findIndex(e=>e.id===id),to=Number(btn.dataset.to);if(i<0||to<0||to>=r.ex.length)return;const [ex]=r.ex.splice(i,1);r.ex.splice(to,0,ex);save();render();return}if(act==='del-ex'){const r=routine(state.selectedRoutine),e=r.ex.find(x=>x.id===id);if(!e||!confirm(`${e.name} 종목을 데모 루틴에서 제거할까요?`))return;r.ex=r.ex.filter(x=>x.id!==id);save();render();return}if(act==='edit-ex')return editModal(id);if(act==='save-ex'){const r=routine(state.selectedRoutine),e=r.ex.find(x=>x.id===id);if(!e)return;const name=$('#edit-name').value.trim();if(!name){toast('종목 이름을 입력해 주세요');return}e.name=name;e.target=Math.max(1,Math.min(30,Number($('#edit-target').value)||3));e.reps=$('#edit-reps').value.trim()||'자율';e.muscle=$('#edit-muscle').value;e.phase=$('#edit-phase').value;save();closeModal();render();toast('종목 변경 완료');return}if(act==='new-lib'){showModal(modalWrap('새 운동 종목 등록',`<div class="field"><label>운동명</label><input id="new-name" maxlength="45" placeholder="예: 케이블 컬"></div><div class="field"><label>운동 부위</label><select id="new-muscle">${MUSCLES.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label>운동 기구</label><select id="new-equipment">${EQ.map(v=>`<option>${v}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn" data-action="save-lib">라이브러리에 등록</button></div>`));return}if(act==='save-lib'){const name=$('#new-name').value.trim();if(!name){toast('종목명을 입력해 주세요');return}if(state.library.some(e=>e.name===name&&e.muscle===$('#new-muscle').value&&e.equipment===$('#new-equipment').value)){toast('이미 등록된 종목이에요');return;}state.library.push({id:`custom_${Date.now()}`,name,muscle:$('#new-muscle').value,equipment:$('#new-equipment').value,sets:3,reps:'8–12'});save();closeModal();render();toast('라이브러리에 등록했어요');return}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)doAction(b)});document.addEventListener('change',e=>{const t=e.target;if(t.id==='lib-filter'){libFilter=t.value;render()}if(t.id==='eq-filter'){eqFilter=t.value;render()}if(['picker-muscle','picker-equipment'].includes(t.id))refreshPicker();if(t.dataset.record){const s=mkSession(todayDate()),id=t.dataset.id,i=Number(t.dataset.set);if(!s.records)s.records={};if(!s.records[id])s.records[id]=[];if(!s.records[id][i])s.records[id][i]={weight:'',reps:''};s.records[id][i][t.dataset.record]=t.value;save()}});document.addEventListener('input',e=>{if(e.target.id==='picker-search'){refreshPicker();return;}if(e.target.id==='lib-search'){libSearch=e.target.value;const start=e.target.selectionStart;render();const input=$('#lib-search');input.focus();input.setSelectionRange(start,start)}});$('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-root')closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
loadCatalog();
})();
</script></body></html>
