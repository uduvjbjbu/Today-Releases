name: Publish verified Today v0.6.7 APK (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.release-v0.6.7-publication-request.txt'
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK-only artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fields < .release-v0.6.7-publication-request.txt
          url="${fields[0]:-}"
          hash="${fields[1]:-}"
          if [[ "$url" != https://* || ! "$hash" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid owner-approved source URL or checksum"
            exit 1
          fi
          curl --fail --location --retry 3 --max-time 180 --silent --show-error "$url" -o artifact.zip
          unzip -Z1 artifact.zip | sort | tee archive-list.txt
          test "$(wc -l < archive-list.txt)" -eq 2
          grep -qx 'Today-v0.6.7-release.apk' archive-list.txt
          grep -qx 'SHA256SUMS.txt' archive-list.txt
          unzip -oq artifact.zip
          sha256sum --check SHA256SUMS.txt
          test "$(sha256sum Today-v0.6.7-release.apk | cut -d' ' -f1)" = "$hash"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          p=Path("Today-v0.6.7-release.apk")
          b=p.read_bytes()
          eocd=b.rfind(b'PK\x05\x06')
          assert eocd>=0, 'Invalid APK ZIP'
          cd=struct.unpack_from('<I',b,eocd+16)[0]
          assert b[cd-16:cd]==b'APK Sig Block 42', 'No Android APK signature block'
          size=struct.unpack_from('<Q',b,cd-24)[0]
          start=cd-size-8
          assert struct.unpack_from('<Q',b,start)[0]==size, 'APK signing block size mismatch'
          def field(data,offset):
              n=struct.unpack_from('<I',data,offset)[0]
              assert offset+4+n<=len(data), 'Malformed signer field'
              return data[offset+4:offset+4+n],offset+4+n
          offset=start+8
          found=False
          while offset<cd-24:
              n=struct.unpack_from('<Q',b,offset)[0]
              kind=struct.unpack_from('<I',b,offset+8)[0]
              data=b[offset+12:offset+8+n]
              if kind==0x7109871a:
                  signers,_=field(data,0)
                  signer,_=field(signers,0)
                  signed,_=field(signer,0)
                  _,i=field(signed,0)
                  certs,_=field(signed,i)
                  cert,_=field(certs,0)
                  expected='ec2dcb6c40f2ef826c7fbe55a0aee86436d92ce4f0fce0a522538696c921df28'
                  assert hashlib.sha256(cert).hexdigest()==expected, 'Signer changed from public v0.6.6!'
                  found=True
              offset+=8+n
          assert found, 'Missing APK signature v2'
          print('Previous release certificate matches v0.6.6')
          PY
      - name: Publish ONLY the verified APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.6.7 >/dev/null 2>&1; then
            echo "::error::v0.6.7 public release exists. Do not overwrite"
            exit 1
          fi
          gh release create v0.6.7 Today-v0.6.7-release.apk \
            --target "$GITHUB_SHA" \
            --title 'Today v0.6.7 — 테마·글자 크기·폰트 설정' \
            --notes 'Today 운동 기록 앱의 정식 업데이트입니다. 기존 v0.6.6 위에 설치하세요(기존 앱 삭제 금지). 새 기능: 5개 전체 테마, 4단계 글씨 크기, 기본·고운돋움·주아체 폰트 설정. 기존 운동 기록, 캘린더, 음악 제어, Health Connect 기능을 유지합니다. 설치 전 운동 기록 JSON 백업을 권장합니다. 이 저장소는 서명된 APK만 공개합니다.'
